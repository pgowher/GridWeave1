[project]
name = "verclo-protocol"
version = "1.4.0"
description = "C-PaE protocol and VERCLO closure services with durable view-changing network trust anchors."
requires-python = ">=3.11"
dependencies = ["cryptography>=41.0.0", "jsonschema>=4.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["verclo*", "protocol*", "policy*", "evidence*", "proof*", "erasure*", "analytics*", "disputes*", "evaluation*"]

[tool.setuptools.package-data]
protocol = ["*.json"]
policy = ["*.json", "profiles/*.json"]
disputes = ["configs/*.json"]
evaluation = ["configs/*.json"]
